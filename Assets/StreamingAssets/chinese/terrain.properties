# =============================================================================
# 地形類型定義（中文）
# 路徑：StreamingAssets/chinese/terrain.properties
# 讀取：TerrainConfigUtil.Load(...)
#
# 設計依據：
#   Docs/TERRAIN.md                           — 對應 C++ AbstractTerrain 欄位
#   Docs/UNIT_STATUS_AND_TERRAIN_HAZARD.md      — 環境傷害等級、TerrainFlags
#   Core/Terrain/TerrainDefinition.cs           — Spike 預設六種 id／消耗
#   Docs/NAVY_AND_RIVER_MOVEMENT.md             — 水格消耗（規劃，見全局參數）
#
# 本檔只定「地形類型」：名稱、進入消耗、能力旗標、火計 n、士氣懲罰。
# 不含：格 q/r 座標、格上建築、OnFire／OnTrap 當下狀態（屬 Location 層）。
# =============================================================================

locale=zh

# --- 全局 ---
# 平原基準進入消耗；對齊 unit.properties movement.daily_points
terrain.movement.baseline_enter_cost=15
# 環境傷害等級上限（TerrainHazardLevel：0～3）
terrain.hazard.max_level=3
# 著火格／陷阱格換算等級時，FireEffect>0 且格 OnFire 時至少為 1（公式待接）
terrain.hazard.fire_effect_min_for_slight=1

# 水軍每進一水格消耗（規劃，見 NAVY_AND_RIVER_MOVEMENT.md；陸軍仍用各 type.enter_cost）
terrain.water.navy_enter_cost_per_cell=4

# TerrainFlags 布林：reachable construction trap fort fireable
# 打包位元：bit0 可達｜bit1 可建｜bit2 可陷｜bit3 要塞｜bit4 可燃（TerrainFlags.Pack）

# --- 平原 id=0（tier-0；可達、可建）---
terrain.type.plain=平原
terrain.type.plain.id=0
terrain.type.plain.enter_cost=15
terrain.type.plain.reachable=true
terrain.type.plain.construction=true
terrain.type.plain.trap=false
terrain.type.plain.fort=false
terrain.type.plain.fireable=false
terrain.type.plain.fire_effect=0
terrain.type.plain.morale_penalty=0

# --- 官道 id=1（低消耗、可建）---
terrain.type.road=官道
terrain.type.road.id=1
terrain.type.road.enter_cost=10
terrain.type.road.reachable=true
terrain.type.road.construction=true
terrain.type.road.trap=false
terrain.type.road.fort=false
terrain.type.road.fireable=false
terrain.type.road.fire_effect=0
terrain.type.road.morale_penalty=0

# --- 丘陵 id=2（tier-2 約 22；可達）---
terrain.type.hill=丘陵
terrain.type.hill.id=2
terrain.type.hill.enter_cost=22
terrain.type.hill.reachable=true
terrain.type.hill.construction=false
terrain.type.hill.trap=false
terrain.type.hill.fort=false
terrain.type.hill.fireable=false
terrain.type.hill.fire_effect=0
terrain.type.hill.morale_penalty=0

# --- 山地 id=3（tier-3 約 35；可達、要塞類）---
terrain.type.mountain=山地
terrain.type.mountain.id=3
terrain.type.mountain.enter_cost=35
terrain.type.mountain.reachable=true
terrain.type.mountain.construction=false
terrain.type.mountain.trap=false
terrain.type.mountain.fort=true
terrain.type.mountain.fireable=false
terrain.type.mountain.fire_effect=0
terrain.type.mountain.morale_penalty=0

# --- 水域 id=4（陸軍不可達；enter_cost 占位 99）---
terrain.type.water=水域
terrain.type.water.id=4
terrain.type.water.enter_cost=99
terrain.type.water.reachable=false
terrain.type.water.construction=false
terrain.type.water.trap=false
terrain.type.water.fort=false
terrain.type.water.fireable=false
terrain.type.water.fire_effect=0
terrain.type.water.morale_penalty=0

# --- 森林 id=5（可達、可燃；火計 n 待平衡）---
terrain.type.forest=森林
terrain.type.forest.id=5
terrain.type.forest.enter_cost=18
terrain.type.forest.reachable=true
terrain.type.forest.construction=false
terrain.type.forest.trap=false
terrain.type.forest.fort=false
terrain.type.forest.fireable=true
terrain.type.forest.fire_effect=1
terrain.type.forest.morale_penalty=0

# =============================================================================
# [規劃中] 水軍細分（尚未接入 TerrainType／尋路；僅備參）
#   大河：寬江水格；蒙衝及以上港灣渡江
#   激流：走舸不可過；蒙衝+需科技
# terrain.type.river_wide=大河
# terrain.type.river_wide.id=6
# terrain.type.river_wide.enter_cost=4
# terrain.type.river_rapids=激流
# terrain.type.river_rapids.id=7
# =============================================================================
