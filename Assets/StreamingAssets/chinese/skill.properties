# =============================================================================
# 兵種戰法文案＋射程＋體力＋傷害加乘（中文）
# 路徑：StreamingAssets/chinese/skill.properties
#
# 用途：
#   名稱／說明 = 多語言文案（之後 english/ 等同 key）
#   .front    = 攻擊距離下限（格，含）
#   .end      = 攻擊距離上限（格，含）
#   .stamina  = 施放該戰法消耗的體力（整數；每招可不同）
#   .damage   = 傷害加乘（百分率；相對普攻）
# 行為／特殊動作仍寫死在 C#。見 Docs/SKILL_DESIGN.md。
#
# key 規則：
#   skill.<兵系>.<適性>            = 顯示名
#   skill.<兵系>.<適性>.desc       = 說明
#   skill.<兵系>.<適性>.front      = 攻擊距離下限
#   skill.<兵系>.<適性>.end        = 攻擊距離上限
#   skill.<兵系>.<適性>.stamina    = 體力消耗
#   skill.<兵系>.<適性>.damage     = 傷害加乘
#   skill.<兵系>.S.<尾碼>          = 特色專有顯示名
#   （同樣有 .desc / .front / .end / .stamina / .damage）
#
# .front / .end（格，皆含兩端；須 front ≤ end）：
#   front=0 end=0     自身／無目標格（純己方增益等）
#   front=1 end=1     僅距離 1（舊寫法 range=1）
#   front=1 end=3     距離 1～3（舊寫法 range=1~3）
#   front=2 end=3     距離 2～3
# 與部隊普攻 attack_range 無關。
#
# .stamina：非負整數；施放時扣體力（扣誰實作時再定）。
#
# .damage：非負整數百分率，相對「同部隊普攻傷害」：
#   100  = 等同普攻（×1.00）
#   125  = 1.25 倍
#   80   = 0.80 倍
#   0    = 本招不造成（以傷害公式結算的）傷害（純增益／純控制等）
# 結算：戰法傷害 ≈ 普攻傷害基準 × (.damage / 100) ×（其他修正）
# 特殊分段（如貫射第二目標半傷）仍寫在 C#；.damage 指主效果基準。
#
# B／A 同兵系共用；S 特色專有。弓兵拼作 archary。器械無 B／A。
# 註解 # <PascalCase拼音> = C# class 名。數值暫定可改。
# =============================================================================

