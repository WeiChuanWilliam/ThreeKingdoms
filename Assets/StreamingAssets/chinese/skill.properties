# =============================================================================
# 兵種戰法名稱（中文）
#
# key 規則：
#   skill.<兵系>.<適性>=名稱
#   skill.<兵系>.S.<特色兵種尾碼>=名稱
#
# B／A 是同兵系共用戰法；S 是特色兵種專有戰法。
# 弓兵兵系依專案約定拼作 archary。
# 器械沒有 B／A 共用招，每個器械只配一個專有戰法。
#
# 本檔是規劃備忘（有哪些招、顯示名、效果註解），可隨時改。
# 特殊動作／射程／結算寫死在 C#，不由此檔驅動。見 Docs/SKILL_DESIGN.md。
#
# 備註格式：# <PascalCase拼音類名> | <效果說明>
# 類名用於日後 C# class（例：class Chandou）；同顯示名共用同一類名。
# 齊射／騎射拼音皆為 qishe → 齊射=QiShe、騎射=QiBingShe（避開撞名）。
#
# 觀念：戰法是獨立物件、自有攻擊範圍（≠ 部隊普攻 attack_range）；
# 結算時吃部隊攻擊係數。同名招可用不同兵種係數。
# =============================================================================

locale=zh

# 步兵
skill.infantry.B=纏鬥
# Chandou | 敵方陷入止步
skill.infantry.A=堅持
# Jianchi | 己方防禦提高直到下次行動 後可以攻擊或待命
skill.infantry.S.qingzhou=突刺
# Tuci | 敵方被打退一格
skill.infantry.S.daji=拉扯
# Lache | 自己退拉敵方進一格
skill.infantry.S.xianzhen=破陣
# Pozhen | 可以前進一格後攻擊敵方 若擊破敵軍可進到敵軍位置
skill.infantry.S.baimao=死守
# Sishou | 到下次行動前 所有受到的傷害減半 然後可以攻擊或待命

# 騎兵
skill.cavalry.B=強襲
# Qiangxi | 使敵方陷入混亂
skill.cavalry.A=衝鋒
# Chongfeng | 自己穿越敵方到敵後
skill.cavalry.S.hubao=突擊
# Tuji | 自己和敵方交換位置
skill.cavalry.S.xilian=追擊
# Zhuiji | 自己進敵方退二格
skill.cavalry.S.bingzhou=閃擊
# Shanji | 攻擊後可移動二格
skill.cavalry.S.baima=騎射
# QiBingShe | 增加攻擊後使用射擊戰法（拼音撞齊射，故用 QiBingShe）

# 弓兵（archary 為目前 properties key 約定）
skill.archary.B=齊射
# QiShe | 增加攻擊後射擊 機率讓敵方武將受傷
skill.archary.A=火矢
# HuoShi | 攻擊有機會使對方著火
skill.archary.S.wudan=破軍
# Pojun | 加攻擊並降低敵方士氣
skill.archary.S.danyang=遠射
# Yuanshe | 加攻擊且攻擊距離３三格的火矢
skill.archary.S.xiandeng=貫射
# Guanshe | 可以貫穿敵方敵後敵方 一半傷害加止步
skill.archary.S.zhuge=殲滅
# Jianmie | 造成二倍傷害

# 器械：每種器械只有一招
skill.siege.S.charger=衝撞
# Chongzhuang | 降低建物耐久值
skill.siege.S.mushou=火龍
# Huolong | 降低建物耐久值加並定燃燒 除非有火神或神算
skill.siege.S.elephant=踐踏
# Jianta | 降低耐久加上可打退野戰單位一格
skill.siege.S.shooter=火矢
# HuoShi | 攻擊有機會使對方著火 同樣戰法 但是是使用井欄的係數
skill.siege.S.stone=投石
# Toushi | 投石
skill.siege.S.crossbow=貫穿
# Guanchuan | 機率使敵方武將受傷 對器械船艦增加傷害

# 水軍
skill.navy.B=火攻
# Huogong | 全船隻 敵方機率著火
skill.navy.A=猛撞
# Mengzhuang | 蒙衝或以上 敵方被擊退二格
skill.navy.S.large=火矢
# HuoShi | 樓船或以上 同樣戰法 但是是使用樓船的係數
skill.navy.S.final=貫穿
# Guanchuan | 鬥艦專屬 同樣戰法 但是是使用鬥艦的係數
